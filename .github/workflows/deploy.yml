name: Remote Update (VPS)

on:
  push:
    branches:
      - main  # Trigger only on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Manually load the environment (NVM is the most common Node manager)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Add common paths just in case
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.local/share/pnpm
            
            # 3. Navigate and Execute
            cd /var/www/repo-gender-reveal-bingo-party/project-files
            git pull origin main
            pnpm install
            pm2 restart gender-bingo --update-env